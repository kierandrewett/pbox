name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy, rustfmt
      - name: Check release version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "pbox"))')
          test "$GITHUB_REF_NAME" = "v$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install musl compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify distributable crates
        run: cargo publish --locked --workspace --dry-run
      - name: Build portable Linux binaries
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p pbox -p pbox-agent -p pbox-relay
      - name: Package and check binaries
        run: |
          target=x86_64-unknown-linux-musl
          mkdir release
          for binary in pbox pbox-agent pbox-relay; do
            target/$target/release/$binary --help > /dev/null
            tar -C target/$target/release -czf release/$binary-$VERSION-$target.tar.gz $binary
          done
          cd release
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --workspace
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
