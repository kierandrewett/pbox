syntax = "proto3";

package pbox.cwd.dev.agent.v1;

service Agent {
  rpc Info(InfoRequest) returns (InfoResponse);
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Exec(stream ExecRequest) returns (stream ExecEvent);
  rpc Terminal(stream ExecRequest) returns (stream ExecEvent);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc StartSession(ExecRequest) returns (TerminalSession);
  rpc ReadSession(SessionRequest) returns (ReadSessionResponse);
  rpc SendSession(SendSessionRequest) returns (SendSessionResponse);
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
  rpc PutFile(stream FileChunk) returns (FileResult);
  rpc GetFile(GetFileRequest) returns (stream FileChunk);
  rpc Forward(stream ForwardEvent) returns (stream ForwardEvent);
}

message InfoRequest {}

message InfoResponse {
  uint32 protocol_version = 1;
  string agent_version = 2;
  string box_id = 3;
  string os_id = 4;
  string os_version = 5;
  string architecture = 6;
  repeated string capabilities = 7;
  string agent_digest = 8;
}

message PingRequest {
  uint32 protocol_version = 1;
}

message PingResponse {
  uint32 protocol_version = 1;
  string box_id = 2;
}

message ExecRequest {
  uint32 protocol_version = 1;
  repeated string argv = 2;
  string cwd = 3;
  map<string, string> env = 4;
  string user = 5;
  bool allocate_pty = 6;
  bytes stdin = 7;
  bool stdin_eof = 8;
  uint32 terminal_rows = 9;
  uint32 terminal_cols = 10;
  // Non-zero values on later stream messages resize the active PTY.
  // Used only by Terminal. Empty means the default session, "main".
  string session_name = 11;
}

message ListSessionsRequest { uint32 protocol_version = 1; }
message ListSessionsResponse { repeated TerminalSession sessions = 1; }
message TerminalSession {
  string name = 1;
  string user = 2;
  string cwd = 3;
  repeated string argv = 4;
  bool attached = 5;
  uint64 created_unix = 6;
  uint32 rows = 7;
  uint32 cols = 8;
}
message SessionRequest {
  uint32 protocol_version = 1;
  string name = 2;
}
message ReadSessionResponse {
  TerminalSession session = 1;
  string text = 2;
  uint32 cursor_row = 3;
  uint32 cursor_col = 4;
}
message SendSessionRequest {
  uint32 protocol_version = 1;
  string name = 2;
  string text = 3;
  repeated string keys = 4;
}
message SendSessionResponse {}
message CloseSessionRequest {
  uint32 protocol_version = 1;
  string name = 2;
}
message CloseSessionResponse {}

message ExecEvent {
  oneof event {
    bytes stdout = 1;
    bytes stderr = 2;
    ExecExit exit = 3;
  }
}

message ExecExit {
  int32 code = 1;
  int32 signal = 2;
}

message FileChunk {
  string path = 1;
  uint32 mode = 2;
  uint32 uid = 3;
  uint32 gid = 4;
  bool atomic_write = 5;
  bytes data = 6;
  bool eof = 7;
  uint32 protocol_version = 8;
}
message GetFileRequest {
  uint32 protocol_version = 1;
  string path = 2;
}

message FileResult {
  uint64 size = 1;
  string digest = 2;
}

message ForwardEvent {
  oneof event {
    ForwardOpen open = 1;
    bytes data = 2;
    ForwardClose close = 3;
  }
}

message ForwardOpen {
  uint32 protocol_version = 1;
  string host = 2;
  uint32 port = 3;
}

message ForwardClose {
  uint32 code = 1;
  bool half_close = 2;
}
