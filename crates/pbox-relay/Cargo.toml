hmac = "0.12"
hex = "0.4"
axum = { version = "0.8.6", features = ["ws"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
url = "2"
