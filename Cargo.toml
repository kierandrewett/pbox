[workspace]
resolver = "3"
members = [
    "crates/pbox-core",
    "crates/pbox-cli",
    "crates/pbox-proto",
    "crates/pbox-crypto",
    "crates/pbox-agent",
    "crates/pbox-agent-client",
    "crates/pbox-relay",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MPL-2.0"
repository = "https://github.com/kierandrewett/pbox"
description = "Proxmox-backed developer sandbox components"
version = "0.1.9"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
dirs = "6.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
toml = "0.8"
base64 = "0.22"
rustls-pki-types = "1.12"
ed25519-dalek = { version = "2.2", features = ["pkcs8"] }
hkdf = "0.12"
ipnet = "2.12"
prost = "0.14"
rcgen = "0.14"
x509-parser = "0.18"
pem = "3.0"
sha2 = "0.10"
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tonic-prost = "0.14"
time = { version = "0.3", features = ["formatting"] }
nix = { version = "0.31.3", features = ["process", "term", "signal", "user"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
