[workspace]
resolver = "3"
members = [
    "crates/pbox-core",
    "crates/pbox-cli",
    "crates/pbox-proto",
    "crates/pbox-crypto",
    "crates/pbox-agent",
    "crates/pbox-agent-client",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
base64 = "0.22"
rustls-pki-types = "1.12"
ed25519-dalek = { version = "2.2", features = ["pkcs8"] }
hkdf = "0.12"
prost = "0.14"
rcgen = "0.14"
sha2 = "0.10"
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tonic-prost = "0.14"
time = "0.3"
tokio-stream = "0.1"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync"] }
